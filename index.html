<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitzordnung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .classroom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            display: grid;
            gap: 10px;
        }
        .left {
            grid-template-columns: repeat(5, 50px);
        }
        .left-back {
            grid-template-columns: repeat(6, 50px);
        }
        .right {
            grid-template-columns: repeat(4, 50px);
        }
        .seat {
            width: 50px;
            height: 50px;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-size: 14px;
        }
        .seat.occupied {
            background-color: #;
        }
        h3 {
            margin-bottom: 10px;
            text-decoration: underline;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Sitzordnung - Zufällige Verteilung</h1>
    <div class="classroom">
        <!-- Vorne -->
        <div>
            <h3>Vorne links</h3>
            <div class="section left" id="front-left">
                <div class="seat" data-row="front-left" data-col="1"></div>
                <div class="seat" data-row="front-left" data-col="2"></div>
                <div class="seat" data-row="front-left" data-col="3"></div>
                <div class="seat" data-row="front-left" data-col="4"></div>
            </div>
        </div>
        <div>
            <h3>Vorne rechts</h3>
            <div class="section right" id="front-right">
                <div class="seat" data-row="front-right" data-col="1"></div>
                <div class="seat" data-row="front-right" data-col="2"></div>
                <div class="seat" data-row="front-right" data-col="3"></div>
                <div class="seat" data-row="front-right" data-col="4"></div>
                <div class="seat" data-row="front-right" data-col="5"></div>
            </div>
        </div>

        <!-- Mitte -->
        <div>
            <h3>Mitte links</h3>
            <div class="section left" id="middle-left">
                <div class="seat" data-row="middle-left" data-col="1"></div>
                <div class="seat" data-row="middle-left" data-col="2"></div>
                <div class="seat" data-row="middle-left" data-col="3"></div>
                <div class="seat" data-row="middle-left" data-col="4"></div>
            </div>
        </div>
        <div>
            <h3>Mitte rechts</h3>
            <div class="section right" id="middle-right">
                <div class="seat" data-row="middle-right" data-col="1"></div>
                <div class="seat" data-row="middle-right" data-col="2"></div>
                <div class="seat" data-row="middle-right" data-col="3"></div>
                <div class="seat" data-row="middle-right" data-col="4"></div>
                <div class="seat" data-row="middle-right" data-col="5"></div>
            </div>
        </div>

        <!-- Hinten -->
        <div>
            <h3>Hinten links</h3>
            <div class="section left-back" id="back-left">
                <div class="seat" data-row="back-left" data-col="1"></div>
                <div class="seat" data-row="back-left" data-col="2"></div>
                <div class="seat" data-row="back-left" data-col="3"></div>
                <div class="seat" data-row="back-left" data-col="4"></div>
                <div class="seat" data-row="back-left" data-col="5"></div>
            </div>
        </div>
        <div>
            <h3>Hinten rechts</h3>
            <div class="section right" id="back-right">
                <div class="seat" data-row="back-right" data-col="1"></div>
                <div class="seat" data-row="back-right" data-col="2"></div>
                <div class="seat" data-row="back-right" data-col="3"></div>
                <div class="seat" data-row="back-right" data-col="4"></div>
                <div class="seat" data-row="back-right" data-col="5"></div>
            </div>
        </div>
    </div>
    <button onclick="assignSeats()">Zufällige Plätze auslosen</button>
<script>
    function assignSeats() {
        const seats = Array.from(document.querySelectorAll('.seat'));
        const students = [
            { name: "Marielena", gender: "f" }, { name: "Lucas", gender: "m" },
            { name: "Niklas", gender: "m" }, { name: "Marcel", gender: "m" },
            { name: "Jan", gender: "m" }, { name: "Elias", gender: "m" },
            { name: "Simon", gender: "m" }, { name: "Samuel", gender: "m" },
            { name: "Liones", gender: "m" }, { name: "Finn-Uwe", gender: "m" },
            { name: "Fynn", gender: "m" }, { name: "Robin", gender: "m" },
            { name: "Elinor", gender: "f" }, { name: "Helen", gender: "f" },
            { name: "Amy", gender: "f" }, { name: "Jette", gender: "f" },
            { name: "Anny", gender: "f" }, { name: "Mia", gender: "f" },
            { name: "Maren", gender: "f" }, { name: "Lea", gender: "f" },
            { name: "Lara", gender: "f" }, { name: "Malin", gender: "f" },
            { name: "Niela", gender: "f" }, { name: "Pauline", gender: "f" },
            { name: "Saphira", gender: "f" }, { name: "Marie S.", gender: "f" },
            { name: "Marie H.", gender: "f" }, { name: "Judith", gender: "f" }
        ];

        const group1 = ["Jan", "Fynn", "Liones", "Robin"];
        const group2 = ["Samuel", "Lucas", "Marcel", "Niklas"];

        const frontAndMiddle = ['front-left', 'front-right', 'middle-left', 'middle-right'];

        // Leere alle Plätze
        seats.forEach(seat => {
            seat.textContent = "";
            seat.classList.remove("occupied");
        });

        let success = false;

        while (!success) {
            const shuffled = [...students].sort(() => Math.random() - 0.5);
            const prob = Math.random();
            const girlsTogether = prob < 0.6;
            const group1Together = prob >= 0.6 && prob < 0.8;
            const group2Together = prob >= 0.8 && prob < 1.0;

            const seatChunks = chunkArray(seats, 4);
            const assigned = [];
            const usedSeats = new Set();

            // Platzierung von Marielena in den vorderen Reihen
            const marielenaSeat = seats.find(seat =>
                frontAndMiddle.includes(seat.dataset.row) && !seat.textContent
            );
            if (!marielenaSeat) continue;
            marielenaSeat.textContent = "Marielena";
            marielenaSeat.classList.add("occupied");
            assigned.push("Marielena");
            usedSeats.add(marielenaSeat);

            function placeGroup(groupNames) {
                for (let chunk of shuffleArray(seatChunks)) {
                    if (chunk.every(seat => !seat.textContent)) {
                        for (let i = 0; i < groupNames.length; i++) {
                            const student = shuffled.find(s => s.name === groupNames[i]);
                            if (!student) return false;
                            chunk[i].textContent = student.name;
                            chunk[i].classList.add("occupied");
                            assigned.push(student.name);
                            usedSeats.add(chunk[i]);
                        }
                        return true;
                    }
                }
                return false;
            }

            if ((group1Together && !placeGroup(group1)) || (group2Together && !placeGroup(group2))) continue;

            // Gruppiere Mädchen, wenn aktiviert (außer Marielena)
            if (girlsTogether) {
                const girls = shuffled.filter(s => s.gender === "f" && s.name !== "Marielena");
                const girlChunks = chunkArray(girls, 4);
                for (let chunk of girlChunks) {
                    if (chunk.length < 2) continue;
                    for (let seatGroup of shuffleArray(seatChunks)) {
                        if (seatGroup.every(seat => !seat.textContent)) {
                            for (let i = 0; i < chunk.length; i++) {
                                seatGroup[i].textContent = chunk[i].name;
                                seatGroup[i].classList.add("occupied");
                                assigned.push(chunk[i].name);
                                usedSeats.add(seatGroup[i]);
                            }
                            break;
                        }
                    }
                }
            }

            // Verbleibende Schüler zufällig platzieren
            for (const student of shuffled) {
                if (assigned.includes(student.name)) continue;
                const free = seats.find(seat => !seat.textContent);
                if (!free) break;
                free.textContent = student.name;
                free.classList.add("occupied");
                usedSeats.add(free);
                assigned.push(student.name);
            }

            success = true;
        }

        // Hilfsfunktionen
        function chunkArray(arr, size) {
            const res = [];
            for (let i = 0; i < arr.length; i += size) {
                res.push(arr.slice(i, i + size));
            }
            return res;
        }

        function shuffleArray(array) {
            return array.slice().sort(() => Math.random() - 0.5);
        }
    }
</script>

</body>
</html>
